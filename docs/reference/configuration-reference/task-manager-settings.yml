---
# This file is used to generate "Task Manager settings" page in the product docs
# For the schema and an example refer to the automated settings reference: 
# https://github.com/elastic/docs-builder/blob/main/docs/syntax/automated_settings.md

product: Kibana
collection: Task Manager settings in Kibana
id: task-manager-settings-kb
page_description: |
  Task Manager runs background tasks by polling for work on an interval. You can configure its behavior to tune for performance and throughput.

groups:
  - group: Task process execution
    id: task-process-execution
    settings:
      - setting: xpack.task_manager.task_execution.mode
        description: |
          Selects where tasks registered as task type modules execute: `in_process`, `child_process`, or `remote`. {{kib}} continues to claim tasks and handle results, retries, and rescheduling. Tasks assigned to a child or remote process never fall back to execution inside {{kib}} when a worker is unavailable, at capacity, or missing a required capability. Tasks without a task type module continue to execute inside {{kib}}.
        datatype: string
        default: in_process
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.bundle_dir
        description: |
          Directory containing the native task bundles and their `manifest.json` in `child_process` mode. Defaults to `task_bundles` in a distribution and `target/task_bundles` in a source checkout. Bundles must match the {{kib}} version.
        datatype: string
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.max_concurrent_processes
        description: |
          Maximum number of child processes serving tasks concurrently, from `1` to `1000`. Defaults to `xpack.task_manager.max_workers`. Tasks that reach this limit are retried without executing inside {{kib}}.
        datatype: int
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.child_max_old_space_mb
        description: |
          Maximum old-generation heap size of each child process in megabytes, from `64` to `65536`. When unset, Node.js chooses the limit. Child processes do not inherit the heap size flags used to start {{kib}}.
        datatype: int
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.child_max_semi_space_mb
        description: |
          Maximum semi-space size of each child process in megabytes, from `1` to `256`. Defaults to `2` when unset. Larger values increase resident memory and can reduce garbage collection during allocation-heavy tasks.
        datatype: int
        default: 2
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.reuse.enabled
        description: |
          Retains idle child processes for subsequent compatible dispatches. Each execution receives its current settings, credentials, feature flags, and execution context, and disposes its execution services before returning to the pool. These settings configure the child process supervisor; remote workers configure their own process pool.
        datatype: bool
        default: false
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.reuse.idle_timeout_ms
        description: |
          Maximum time an unused retained child process remains idle, in milliseconds, from `1` to `3600000`.
        datatype: int
        default: 30000
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.reuse.max_age_ms
        description: |
          Maximum age of a retained child process, in milliseconds, from `1` to `86400000`. A process retires between executions when its age limit is reached.
        datatype: int
        default: 300000
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.reuse.max_runs
        description: |
          Maximum number of executions served by a retained child process before retirement, from `1` to `100000`.
        datatype: int
        default: 100
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.reuse.max_idle_processes
        description: |
          Maximum number of idle child processes retained by the supervisor, from `1` to `1000`. This limit is separate from the limit on concurrently executing processes.
        datatype: int
        default: 10
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.remote.url
        description: |
          URL of the task worker serving native bundles. Required when `mode` is `remote`. The worker must serve bundles matching the {{kib}} version and support the task process protocol.
        datatype: string
        applies_to:
          self: preview

      - setting: xpack.task_manager.task_execution.remote.token
        description: |
          Bearer token used to authenticate requests to the remote worker. Set this to the worker's `TASK_PROCESS_TOKEN` when worker authentication is enabled.
        datatype: string
        applies_to:
          self: preview

  - group: Task Manager settings
    id: task-manager-settings
    settings:

      - setting: xpack.task_manager.max_attempts
        description: |
          The maximum number of times a task will be attempted before being abandoned as failed.
        datatype: int
        default: 3
        applies_to:
          self: ga
          ech: unavailable

      - setting: xpack.task_manager.poll_interval
        description: |
          How often, in milliseconds, the task manager will look for more work. Cannot be lower than 100.
        datatype: int
        default: 500
        applies_to:
          self: ga
          ech: ga

      - setting: xpack.task_manager.request_capacity
        description: |
          How many requests can Task Manager buffer before it rejects new requests.
        datatype: int
        default: 1000
        applies_to:
          self: ga
          ech: unavailable

      - setting: xpack.task_manager.max_workers
        description: |
          The maximum number of tasks that this Kibana instance will run simultaneously. The maximum value is 100.
        datatype: int
        default: 10
        applies_to:
          - "stack: deprecated 8.16"
          - "self: ga"
          - "ech: ga"
        deprecation_details: "This setting was deprecated in 8.16.0."

      - setting: xpack.task_manager.monitored_stats_health_verbose_log.enabled
        description: |
          This flag will enable automatic warn and error logging if task manager self detects a performance issue, such as the time between when a task is scheduled to execute and when it actually executes.
        datatype: bool
        default: false
        applies_to:
          self: ga
          ech: ga

      - setting: xpack.task_manager.monitored_stats_health_verbose_log.warn_delayed_task_start_in_seconds
        description: |
          The amount of seconds we allow a task to delay before printing a warning server log.
        datatype: int
        default: 60
        applies_to:
          self: ga
          ech: ga

      - setting: xpack.task_manager.monitored_stats_health_verbose_log.level
        description: |
          The log level used when verbose health logging is enabled. Set to `debug` for detailed output or `info` for higher-level summaries.
        datatype: enum
        default: 'debug'
        options:
          - option: debug
          - option: info
        applies_to:
          stack: ga 8.6
          ech: ga
          self: ga

      - setting: xpack.task_manager.event_loop_delay.monitor
        description: |
          Enables event loop delay monitoring, which will log a warning when a task causes an event loop delay which exceeds the `warn_threshold` setting.
        datatype: bool
        default: true
        applies_to:
          self: ga
          ech: ga

      - setting: xpack.task_manager.event_loop_delay.warn_threshold
        description: |
          Sets the amount of event loop delay during a task execution which will cause a warning to be logged.
        datatype: int
        default: 5000
        applies_to:
          self: ga
          ech: ga

      - setting: xpack.task_manager.version_conflict_threshold
        description: |
          The percentage threshold of workers experiencing version conflicts above which Task Manager shifts its polling interval to avoid overloading Elasticsearch. Accepts values between 50 and 100.
        datatype: int
        default: 80
        applies_to:
          stack: ga 7.11
          ech: ga
          self: ga

      - setting: xpack.task_manager.capacity
        description: |
          Controls the number of tasks that can be run at one time. The minimum value is 5 and the maximum is 50.
        datatype: int
        default: 10
        applies_to:
          self: ga
          ech: ga

  - group: Task Manager health settings
    id: task-manager-health-settings
    description: |
      Settings that configure the [Health monitoring](docs-content://deploy-manage/monitor/kibana-task-manager-health-monitoring.md) endpoint.
    settings:

      - setting: xpack.task_manager.ephemeral_tasks.enabled
        description: |
          Set to `true` to enable ephemeral tasks, which ran actions inline without persisting them to Elasticsearch.
        datatype: bool
        default: false
        applies_to:
          - "stack: ga 7.15, deprecated 8.8, removed 9.0"
          - "ech: ga"
          - "self: ga"
        deprecation_details: "Ephemeral tasks were deprecated in 8.8 and removed in 9.0. This setting has no effect on Kibana 9.0 and later."

      - setting: xpack.task_manager.ephemeral_tasks.request_capacity
        description: |
          The maximum number of ephemeral task requests that can be queued.
        datatype: int
        default: 10
        applies_to:
          - "stack: ga 7.15, deprecated 8.8, removed 9.0"
          - "ech: ga"
          - "self: ga"
        deprecation_details: "Ephemeral tasks were deprecated in 8.8 and removed in 9.0. This setting has no effect on Kibana 9.0 and later."

      - setting: xpack.task_manager.monitored_task_execution_thresholds
        description: |
          Configures the threshold of failed task executions at which point the `warn` or `error` health status is set under each task type execution status (under `stats.runtime.value.execution.result_frequency_percent_as_number[${task type}].status`).

          This setting allows configuration of both the default level and a custom task type specific level. By default, this setting is configured to mark the health of every task type as `warning` when it exceeds 80% failed executions, and as `error` at 90%.

          Custom configurations allow you to reduce this threshold to catch failures sooner for task types that you might consider critical, such as alerting tasks.

          This value can be set to any number between 0 to 100, and a threshold is hit when the value **exceeds** this number. This means that you can avoid setting the status to `error` by setting the threshold at 100, or hit `error` the moment any task fails by setting the threshold to 0 (as it will exceed 0 once a single failure occurs).
        datatype: int
        applies_to:
          self: ga
          ech: ga
